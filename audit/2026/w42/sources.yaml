- id: W42-S1
  title: "Access Rate-Dependent Endurance Behavior of Ferroelectric Hafnium Zirconium Oxide Capacitors"
  authors: [Roberto Guido, Julie Laguerre, Pramoda Vishnumurthy, Florian Wunderwald, Kristina Holsgrove, Thomas Mikolajick, Sou-Chi Chang, Alfred Kersch, Uwe Schroeder]
  venue: "arXiv preprint (physics.app-ph per arXiv listing; not peer-reviewed as of 2026-10-26)"
  doi: 10.48550/arXiv.2610.20154
  url: https://arxiv.org/abs/2610.20154
  publication_date: "2026-10-14 (arXiv v1 submitted 2026-10-14T13:11:11Z; DataCite 'Submitted')"
  online_date: "2026-10-15 (DataCite registered 2026-10-15T02:54:24Z; arXiv listing date not separately confirmed -> UNKNOWN to the day)"
  selection_class: new_this_week
  source_access: full_text
  access_basis: "arXiv PDF downloaded via curl; text extracted by pdftotext; open arXiv e-print, no paywall/login"
  read_ranges: "chars 0-73233 of extraction (entire main text + Supporting Information S1-S4, Tables S1-S3). Figures 1-5 and S1-S2 NOT read as images (captions and surrounding text only)."
  resolve_evidence:
    - "doi.org HEAD 302 -> https://arxiv.org/abs/2610.20154 (2026-10-26)"
    - "DataCite: title/authors match; Submitted 2026-10-14T13:11:11Z; Updated 2026-10-15T01:15:19Z"
    - "arXiv Atom API id_list=2610.20154: published 2026-10-14T13:11:11Z; only v1"
    - "Crossref: not applicable (arXiv DOIs are DataCite)"
  facts:
    - id: F1
      label: SOURCE_REPORTED
      location: "Sec 2 first paragraph, Fig 1"
      text: "Capacitor stack = 5 nm Hf0.5Zr0.5O2 between 10 nm TiN electrodes (bottom electrode also 30 nm W; top contact W or Ti/Pt); ALD at 300 C, RTA 500 C in N2; area 1963 um^2 (Methods). Pr reached 19.3 uC/cm^2 after 2e6 bipolar cycles (Fig 1c), read by the authors as the switching fraction rising from about 50% to about 77% (AUTHOR_INTERPRETATION)."
    - id: F2
      label: SOURCE_REPORTED
      location: "Fig 2 and text"
      text: "Wake-up (merging of two switching-current peaks) completes after about 1e4 cycles regardless of delay time 200 ns - 200 us; extra switchable polarization saturates at 10-12 uC/cm^2 after 1e6 cycles; relative permittivity falls from 34 to 28.5 independent of delay. Authors conclude wake-up depends on field-on time, not on delay between pulses."
    - id: F3
      label: SOURCE_REPORTED
      location: "Fig 3, Methods"
      text: "Test at 2 ms delay after 1e6 wake-up cycles at 100 kHz, +-2 V, 5 us pulses: unipolar non-switching cycling shifts the switching-current peaks / coercive field (internal bias) but gives no 2Pr loss; bipolar switching cycling gives 2Pr loss without a peak shift. Authors conclude the loss is not explained by imprint alone."
    - id: F4
      label: AUTHOR_INTERPRETATION
      location: "Fig 4, Sec 2 (pp. 9-13), Table S1"
      text: "Proposed mechanism: oxygen-vacancy levels near the TiN electrode lose electrons, giving positively charged vacancies; ab initio (HSE06) puts neutral-V_O occupied levels about 2.0 eV (Zr-rich) vs about 2.85 eV (Hf-rich) below CBM, TiN conduction-band offset taken as 2.3 eV, ionization relaxation lifts the empty state by about 1.5 eV so electron recapture is effectively irreversible. Accumulated positive charge raises the local switching threshold so some domains stop nucleating. Drift-diffusion run used a fixed accumulated charge of 0.1 C/m^2."
    - id: F5
      label: SOURCE_REPORTED
      location: "Eq. (1), Fig 5a, Tables S2-S3"
      text: "A logarithmic charge-relaxation model (Eq. 1; derivation S4) fits 2Pr reduction vs cycle count for delay 200 ns - 2 ms at 25 C. Fitted crossover time tau0: 98.0 ns (2 ms), 157.1 ns (200 us), 330.1 ns (20 us) per Table S2; the authors state no reduction was seen for 200 ns and 2 us so those tau0 values are only indicative."
    - id: F6
      label: SOURCE_REPORTED
      location: "Fig 5b inset, Table S3, p.15"
      text: "At 2 ms delay, 25-135 C: tau0 = 111.0 / 79.3 / 61.8 / 58.1 / 53.0 ns at 25 / 55 / 85 / 105 / 135 C. Activation energy 0.09 eV (low-T region) falling to 0.04 eV above about 85 C; authors contrast this with 0.5-1.2 eV for V_O migration and read it as thermal electron de-trapping rather than defect migration (AUTHOR_INTERPRETATION)."
    - id: F7
      label: EXTRAPOLATION_ONLY
      location: "Fig 5a inset"
      text: "2Pr after 1e10 cycles vs access rate is obtained by extrapolating the fitted model, not by measurement; model validity is claimed only for T <= 135 C and delay <= 2 ms."
  key_conditions: "Single capacitor stack; ferroelectric capacitor (not a transistor/cell); room temperature plus 25-135 C series; delay 200 ns-2 ms; cycling amplitude +-2 V; 5 us pulses; PUND readout 4.6 kHz."
  why_it_fits: "Directly about cycling endurance vs retention-like (imprint) interplay and a physics-based lifetime extrapolation with Arrhenius-type activation energy and explicit validity range. Relevant method analogy for trap/defect charge-state kinetics in HfO2-based stacks; it supports the repo rule that extrapolation needs mechanism equivalence."
  vnand_directness: "indirect. Hafnia FE capacitor (FeRAM-type), not a charge-trap NAND cell. Only linkage to NAND is via hybrid FeNAND concepts (see S5). Do not map numbers to VNAND."
  extrapolation_warnings:
    - "1e10-cycle result is a fit extrapolation; Ea of 0.04-0.09 eV is a fitting-model parameter of one stack."
    - "Drift-diffusion model has no switching kinetics and is a simplification admitted by the authors (kinetic Monte Carlo suggested as more realistic)."
    - "Preprint, unreviewed. Planar capacitor geometry; do not apply planar E=V/t to cylindrical coaxial NAND stacks."
  evidence_grade: "B- (literature + same-domain mechanism, not NAND-domain); D if used for VNAND numbers"
  overlap_check:
    used_sources_md: "not listed (W40, W43 used; W44 reserved list does not include it)"
    origin_main: "no DOI/arXiv-id match in reports/knowledge/audit except audit/2026/w43/rejected.md, where it is listed as 'reserve only' (never used)"
    other_branches: "no match in reliability-w41, reliability-w43, weekly/2026-w40, weekly/2026-w43"
    w41_conflict: "no (first submitted 2026-10-14)"
  fulltext_notes: fulltext_notes_W42-S1.md

- id: W42-S2
  title: "Decoupling Trap States in Amorphous Oxide Semiconductor Transistor Using a Conductive-Semiconducting-Conductive MOS Structure"
  authors: [Kai Chen, Wei Zhang, Xuanyao Fong, Shengman Li, Yunlong Li]
  venue: "arXiv preprint (not peer-reviewed as of 2026-10-26)"
  doi: 10.48550/arXiv.2610.16438
  url: https://arxiv.org/abs/2610.16438
  publication_date: "2026-10-12 (arXiv v1 submitted 2026-10-12T09:03:22Z)"
  online_date: "2026-10-14 (DataCite registered 2026-10-14T07:07:31Z; announcement day not separately confirmed)"
  selection_class: new_this_week
  source_access: full_text
  access_basis: "arXiv PDF via curl + pdftotext; open"
  read_ranges: "chars 0-23584 (entire 4-page letter). Figs 1-10 NOT read as images (captions and text only)."
  resolve_evidence:
    - "doi.org HEAD 302 -> https://arxiv.org/abs/2610.16438 (2026-10-26)"
    - "DataCite title/authors match; Submitted 2026-10-12T09:03:22Z; Updated 2026-10-14T02:11:11Z"
    - "arXiv API: published 2026-10-12T09:03:22Z"
  facts:
    - id: F1
      label: SOURCE_REPORTED
      location: "Sec II, Fig 2"
      text: "Test device = bottom-gate IGZTO TFT: 30 nm Ni gate on p+ Si with 100 nm SiO2, 6 nm ALD HfO2 (N2 anneal 400 C, 30 min), 4.5 nm sputtered IGZTO, Ni/W/Pt source-drain, final O2 anneal 400 C 1 h to oxygen-compensate the exposed channel while Pt-covered IGZTO stays conductive (the 'CSC' structure)."
    - id: F2
      label: SOURCE_REPORTED
      location: "Sec III-A, Fig 3"
      text: "Subthreshold swing about 63.6 mV/dec and hysteresis about 4.7 mV. Capacitance with drain floating is about half that with S/D shorted; nominal exposed channel area 400 um^2 and S/D overlap 900 um^2, effective channel area estimated about 600 um^2 and used for trap-density normalization."
    - id: F3
      label: SOURCE_REPORTED
      location: "Sec III-B, Figs 4-5"
      text: "A Gp/omega peak that moves with Vg tracks total conductance (peak frequency vs 1/R_total linear, Fig 4c-d), i.e. an RC artifact; low-frequency Gp/omega follows gate leakage (Fig 4b) and falls roughly as 1/f, negligible above 100 kHz (Fig 8a). Longer channels add extra peaks (Fig 5); small-area devices are masked by RC loss, leakage and noise. Measurement range 1 kHz-1 MHz."
    - id: F4
      label: SOURCE_REPORTED
      location: "Sec III-C, Figs 6, 8e"
      text: "Optical bandgap 3.839 eV, EC-EF about 0.283 eV (UPS). Depletion (Vg -1 to -0.1 V): apparent interface-state density 9-12e11 /eV/cm^2, time constant about 250 ns nearly bias-independent."
    - id: F5
      label: SOURCE_REPORTED
      location: "Sec III-C, Fig 9d"
      text: "Weak-to-moderate accumulation (Vg 0-0.7 V): apparent volumetric shallow-state DOS 1e18-1e19 /eV/cm^3, Gaussian-like, response time us down to ns; about 0.3 eV surface-potential modulation; value is reported WITHOUT full RC correction (authors say a rigorous equivalent-circuit model is still needed)."
    - id: F6
      label: SOURCE_REPORTED
      location: "Sec III-C, Figs 9j, 10c"
      text: "Moderate-to-strong accumulation (Vg 0.8-2 V): Dit rises to 2.8-3.1e12 /eV/cm^2 with time constant near 250 ns (about 3x the depletion value); L=5 um devices with W=80 and 50 um give consistent Dit after area normalization."
  key_conditions: "Single device family (IGZTO, 4.5 nm), conductance method 1 kHz-1 MHz, bias-resolved Vg -1 to 2 V. Measurement temperature: not stated in the text read (UNKNOWN)."
  why_it_fits: "Trap-state spectroscopy for a thin channel material; method illustrates how contact/RC/leakage artifacts can masquerade as trap loss, which transfers as a caution to conductance-method analysis of any thin channel (including poly-Si)."
  vnand_directness: "indirect. Oxide-semiconductor TFT, not poly-Si and not a NAND string. The paper's own intro mentions only 'monolithic 3D integration'. Link to NAND channels is ENGINEERING_INFERENCE via S5 (OS channel discussion)."
  extrapolation_warnings:
    - "No stress/BTI/lifetime data: only trap density and time constants; no reliability extrapolation is supported."
    - "Apparent DOS values contain residual RC contribution (authors' own statement)."
    - "Planar bottom-gate TFT geometry; no coaxial/cylindrical analogue was tested."
  evidence_grade: "C (physics-consistent, measured in a different material system)"
  overlap_check:
    used_sources_md: "not listed"
    origin_main: "no match"
    other_branches: "no match"
    w41_conflict: "no (first submitted 2026-10-12)"
