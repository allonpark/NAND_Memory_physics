<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500"><rect width="1200" height="500" fill="white"/><text x="45" y="42" font-family="Arial" font-size="25" font-weight="700">GaN HEMT reliability is path-dependent, not only bias-dependent</text><text x="45" y="70" font-family="Arial" font-size="15" fill="#667085">Mechanism timeline redraw; source-reported sequential-stress behavior, not a reconstructed numeric plot</text><g font-family="Arial"><line x1="90" y1="205" x2="1110" y2="205" stroke="#475569" stroke-width="3"/><g font-size="16" text-anchor="middle"><rect x="110" y="145" width="160" height="90" rx="12" fill="#fee2e2"/><text x="190" y="180">VGS −5→−7 V</text><text x="190" y="207">large evolution</text><rect x="320" y="145" width="160" height="90" rx="12" fill="#ffedd5"/><text x="400" y="180">VGS −8→−9 V</text><text x="400" y="207">smaller increment</text><rect x="530" y="145" width="160" height="90" rx="12" fill="#dcfce7"/><text x="610" y="180">VGS +2 V</text><text x="610" y="207">partial recovery</text><rect x="740" y="145" width="160" height="90" rx="12" fill="#dbeafe"/><text x="820" y="180">drain-current</text><text x="820" y="207">stress</text><rect x="950" y="145" width="130" height="90" rx="12" fill="#f1f5f9"/><text x="1015" y="180">final state</text><text x="1015" y="207">≠ virgin</text></g><path d="M200 285 C350 330 470 320 600 280 S850 250 1020 300" fill="none" stroke="#7c3aed" stroke-width="5"/><text x="600" y="355" text-anchor="middle" font-size="17" fill="#6d28d9">hidden state x(t): trap occupancy + recoverable charge + persistent defects</text><text x="600" y="405" text-anchor="middle" font-size="17">d x/dt = capture(V,T,x) − emission(V,T,x) + generation(V,T)</text><text x="600" y="445" text-anchor="middle" font-size="15" fill="#667085">Critical point: later-bias response cannot be interpreted as an independent voltage-acceleration point.</text></g></svg>