name: Build and deploy NAND Memory Physics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Korean fonts and PDF validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-core fonts-stix poppler-utils fontconfig
          fc-cache -f
          echo "Resolved Korean font:"
          fc-match "Noto Sans CJK KR"
          fc-match "Noto Sans CJK KR" | grep -qi "NotoSansCJK"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Build downloadable weekly PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads/2026
          for W in 37 38 39; do
            PDF="$GITHUB_WORKSPACE/downloads/2026/VNAND_HV_Reliability_2026-W${W}.pdf"
            chrome --headless --no-sandbox --disable-gpu --allow-file-access-from-files \
              --run-all-compositor-stages-before-draw --virtual-time-budget=3000 \
              --no-pdf-header-footer --print-to-pdf="$PDF" \
              "file://$GITHUB_WORKSPACE/reports/2026/w${W}/index.html"
            test -s "$PDF"
          done

      - name: Validate PDF fonts and Korean text
        shell: bash
        run: |
          set -euo pipefail
          for W in 37 38 39; do
            PDF="$GITHUB_WORKSPACE/downloads/2026/VNAND_HV_Reliability_2026-W${W}.pdf"
            echo "--- W${W} embedded fonts ---"
            pdffonts "$PDF"
            pdffonts "$PDF" | grep -Ei 'NotoSansCJK.*yes' >/dev/null
          done
          pdftotext "$GITHUB_WORKSPACE/downloads/2026/VNAND_HV_Reliability_2026-W37.pdf" - | grep -q '이번 회차'
          pdftotext "$GITHUB_WORKSPACE/downloads/2026/VNAND_HV_Reliability_2026-W38.pdf" - | grep -q '이번 회차'
          pdftotext "$GITHUB_WORKSPACE/downloads/2026/VNAND_HV_Reliability_2026-W39.pdf" - | grep -q '이번 주 핵심'
          echo "Korean font embedding and text-layer validation: PASS"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
