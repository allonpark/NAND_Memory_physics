<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="white"/><text x="45" y="42" font-family="Arial" font-size="25" font-weight="700">SiC MOSFET: separate gate-oxide degradation from bond-wire fatigue in switching</text><text x="45" y="70" font-family="Arial" font-size="15" fill="#667085">Diagnostic logic redraw from Zhang et al. (IET Power Electronics 2026)</text><g font-family="Arial"><rect x="90" y="125" width="300" height="110" rx="15" fill="#fee2e2" stroke="#dc2626"/><text x="240" y="165" text-anchor="middle" font-size="18" font-weight="700">Gate oxide degradation</text><text x="240" y="198" text-anchor="middle" font-size="16">+ΔVTH → ↓ diD/dt</text><rect x="90" y="285" width="300" height="110" rx="15" fill="#ffedd5" stroke="#ea580c"/><text x="240" y="325" text-anchor="middle" font-size="18" font-weight="700">Bond-wire fatigue</text><text x="240" y="358" text-anchor="middle" font-size="16">↑RS, ↑LS → ↓ diD/dt</text><rect x="470" y="205" width="260" height="110" rx="15" fill="#dbeafe" stroke="#2563eb"/><text x="600" y="245" text-anchor="middle" font-size="18" font-weight="700">same observable</text><text x="600" y="278" text-anchor="middle" font-size="17">Δ(diD/dt)max_ratio</text><path d="M390 180 L470 235" stroke="#334155" stroke-width="4"/><path d="M390 340 L470 285" stroke="#334155" stroke-width="4"/><rect x="810" y="115" width="300" height="130" rx="15" fill="#dcfce7" stroke="#16a34a"/><text x="960" y="155" text-anchor="middle" font-size="18" font-weight="700">Sweep VGH @ high RG</text><text x="960" y="188" text-anchor="middle" font-size="15">gate-oxide component changes</text><text x="960" y="218" text-anchor="middle" font-size="15">bond-wire component suppressed</text><rect x="810" y="285" width="300" height="130" rx="15" fill="#f3e8ff" stroke="#7c3aed"/><text x="960" y="325" text-anchor="middle" font-size="18" font-weight="700">Sweep RG @ low VGH</text><text x="960" y="358" text-anchor="middle" font-size="15">bond-wire component changes</text><text x="960" y="388" text-anchor="middle" font-size="15">gate-oxide sensitivity retained</text><path d="M730 245 L810 185" stroke="#334155" stroke-width="4"/><path d="M730 280 L810 350" stroke="#334155" stroke-width="4"/><text x="600" y="470" text-anchor="middle" font-size="15" fill="#667085">Validated on 1200 V / 32 A TO-247-3 DUT; HTGB 150°C, VG=27 V used to emulate oxide degradation.</text></g></svg>