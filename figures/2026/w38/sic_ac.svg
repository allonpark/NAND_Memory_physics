<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430"><style>text{font-family:'Noto Sans CJK KR',sans-serif;fill:#172033}.s{font-size:20px}.sm{font-size:16px}.b{font-weight:700}</style><rect width="900" height="430" fill="white"/><text x="30" y="34" class="s b">SiC AC-TDDB: rise-time becomes an independent damage variable</text><line x1="90" y1="330" x2="820" y2="330" stroke="#333"/><line x1="90" y1="330" x2="90" y2="80" stroke="#333"/><text x="790" y="360" class="sm">time</text><text x="30" y="95" class="sm">Vg</text><path d="M100 300 L160 300 L190 120 L310 120 L340 300 L470 300 L490 120 L610 120 L640 300 L780 300" fill="none" stroke="#2463c5" stroke-width="4"/><path d="M100 300 L160 300 L170 120 L310 120 L320 300 L470 300 L478 120 L610 120 L618 300 L780 300" fill="none" stroke="#d33" stroke-width="3"/><text x="180" y="110" class="sm">slow edge (~90 ns)</text><text x="500" y="110" class="sm">fast edge (~7 ns)</text><text x="160" y="390" class="sm">1 MHz source test: shorter rise time → faster leakage decay despite AC lifetime > DC overall.</text></svg>