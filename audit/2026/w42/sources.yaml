week: 2026-W42
window: {start: 2026-10-12, end: 2026-10-18, tz: Asia/Seoul}
search_date: 2026-10-26
databases_queried:
  - Crossref REST (journals/{ISSN}/works with from-pub-date/from-online-pub-date/from-created-date; works?query.title) 2026-10-26
  - OpenAlex (title_and_abstract.search; from/to_publication_date) 2026-10-26 -> partly rate-limited (HTTP 429 after first batch; coverage incomplete = UNKNOWN)
  - arXiv API (submittedDate range 2026-10-12..10-18, 18 keyword queries) 2026-10-26
  - DataCite API (arXiv DOI metadata), Unpaywall (OA status), doi.org HEAD (resolution)
coverage_limits:
  - IEEE and Elsevier journals carry only an issue month in Crossref (e.g. 2026-10, 2026-11); online (early-access) day is not obtainable without IEEE Xplore/ScienceDirect, whose pages are JS or bot-blocked. They were NOT scraped. Items from those publishers therefore cannot be placed inside the window and were not selected (see rejected.md).
  - MDPI, Wiley and IOP full-text pages returned HTTP 403 or abstract-only to automation; not bypassed.
  - Elsevier DOIs: metadata path only (sciencedirect_lookup.py not run; no Elsevier item was selected, no API key set).
window_finding_directness: >
  In-window items that are (a) verifiable to the day, (b) readable, and (c) directly about charge-trap 3D NAND / poly-Si channel / GIDL / CTL retention are scarce.
  Only ONE in-window source is 3D NAND direct (S3, abstract_only, system-level). Two archive_gap sources (S4, S5) are 3D NAND direct and full_text.
  No in-window source directly about GIDL or CTL retention physics was found/readable. This is a search-coverage statement, not proof of absence.

