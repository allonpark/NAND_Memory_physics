  - id: W41-S5
    title: "Modeling of random telegraph noise decay constant in 3D NAND flash memory using machine learning-based Monte Carlo simulation"
    authors: ["Eunseok Oh", "Hyungcheol Shin"]
    affiliations: "Seoul National University (ECE/ISRC); Integra Semiconductor Ltd., Seoul"
    venue: "Journal of Computational Electronics 25:196 (2026), Springer"
    doi_or_url: "10.1007/s10825-026-02647-9 ; https://link.springer.com/article/10.1007/s10825-026-02647-9"
    publication_date: "2026-09-29 (Crossref issued/published-online; print issue 2026-10)"
    online_date: "2026-09-29"
    selection_class: archive_gap   # OUTSIDE the window (published 7 days before 2026-10-05); no in-window item with equal VNAND directness was found
    received_accepted: "Received 2026-05-12 / Accepted 2026-09-19 (from PDF front page)"
    source_access: full_text   # open access CC BY 4.0, PDF fetched from link.springer.com/content/pdf, pdftotext
    read_ranges: "pdftotext extraction (33,530 chars): chars 0-33,530 read in full (abstract through references). Figures: not viewed; equation (1)-(4) typography garbled by extraction so exponents are taken from body text only."
    resolve_evidence:
      doi_org: "https://doi.org/10.1007/s10825-026-02647-9 -> HTTP 302 -> link.springer.com/10.1007/s10825-026-02647-9"
      crossref: "title, authors Oh/Shin, issued/published-online 2026-09-29, print 2026-10, license CC BY 4.0 match"
    facts:
      - {label: SOURCE_REPORTED, loc: "Abstract; Conclusion", text: "Poly-Si-channel 3D NAND shows N_trap-dependent scaling of the RTN decay constant (delta), attributed to percolation through grain boundaries; delta ~ cube root of average trap number, vs square root in 2D NAND."}
      - {label: SOURCE_REPORTED, loc: "Sec 2; Fig 2b-c", text: "3D NAND unit cell has channel, filler and O/N/O layers; variables include Tox, Tctn (charge-trap nitride), Tbox, filler radius Rf, WL length LWL, poly-Si thickness Tpoly (channel-thickness range in axis labels ~7.5-8.5 nm; figure not viewed)."}
      - {label: SOURCE_REPORTED, loc: "Sec 2", text: "Validation on 2D NAND: 100 TCAD runs per condition (10x10 trap grid). 3D: channel thickness split into 5 and WL length into 20 segments -> 100 trap locations."}
      - {label: SOURCE_REPORTED, loc: "Sec 3", text: "ANN trained on TCAD of 1000 cells with random grain boundaries and trap positions; Markov-process Monte Carlo with 10,000 runs per cell-variation split; analysis restricted to average trap number >= 3 because lower values give abnormal CDFs."}
      - {label: SOURCE_REPORTED, loc: "Sec 3; Fig 5", text: "Scaling exponents of delta vs Tox, Tctn, Tbox sum to about 0.9 and are nearly independent of N_trap (same as 2D NAND)."}
      - {label: SOURCE_REPORTED, loc: "Sec 3; Fig 7-8", text: "Under low N_trap, delta is roughly inversely proportional to the fourth root of LWL and to Tpoly; the absolute exponent for Tpoly decreases and saturates as N_trap grows."}
      - {label: SOURCE_REPORTED, loc: "Sec 3 near Eq 4", text: "Vt-shift amplitudes in poly-Si 3D NAND follow a double-Gaussian (dominant vs negligible traps by proximity to percolation paths), vs single Gaussian in 2D NAND."}
      - {label: SOURCE_REPORTED, loc: "Sec 2 (Fig 4)", text: "With grain boundaries, delta vs Tpoly is non-monotonic, and a few hundred TCAD samples are stated to be insufficient to capture grain-boundary randomness."}
    key_conditions: "Simulation only (TCAD + ANN + Monte Carlo), unit-cell read-operation geometry, no measured data in the paper; 'No datasets were generated' per data statement."
    why_it_fits: "Poly-Si channel, grain-boundary percolation, charge-trap-nitride cell in a macaroni (filler) channel: most VNAND-direct paper found near the window. Reliability (RTN, Vt distribution tail)."
    vnand_directness: "direct (3D NAND string unit cell with filler, poly-Si channel, O/N/O; cylindrical coaxial implied by filler radius Rf and O/N/O stack; exact cell geometry beyond Fig 2 not stated in text read)."
