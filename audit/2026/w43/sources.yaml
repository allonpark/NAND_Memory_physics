  authors: [Aarre Kilpelainen, Meelis-Mait Sildoja, Toomas Kubarsepp, Peter Meindl, Tobias Pohl, Lutz Werner, Trinh Tran, Jarle Gran, Farshid Manoocheri, Eivind Bardalen, Erkki Ikonen]   # diacritics dropped here; Crossref: Kilpeläinen, Kübarsepp
  venue: "AIP Advances 16(10), 105116 (CC BY 4.0)"
  doi: 10.1063/5.0347445
  stable_url: https://pubs.aip.org/adv/article/16/10/105116/3406826/Characterization-of-impact-ionization-rate-in
  publication_date: 2026-10-20   # online; issue label is 2026-10-01 (issue-level only)
  online_date: 2026-10-20
  discovery_date: 2026-10-21
  selection_class: new_this_week
  source_access: full_text   # body read (Intro, Methods, Results, Discussion, captions); Eq.(3) garbled in extraction
  resolve_evidence: "doi.org -> 302 to pubs.aip.org/adv/article/16/10/105116/...; page: published online Oct 20 2026, received Jun 21, accepted Oct 5 2026; Crossref online 2026-10-20; authors match"
  facts:
    - {tag: SOURCE_REPORTED, loc: abstract, text: "Spectral responsivity of induced-junction-photodiode trap detectors measured against a cryogenic radiometer over 250-476 nm yields impact-ionization data in Si."}
    - {tag: SOURCE_REPORTED, loc: "Eq.(1)", text: "R = (e/h-nu)(1-rho)(1-delta)(1+g): rho reflectance, delta recombination loss, g impact-ionization contribution."}
    - {tag: SOURCE_REPORTED, loc: "Eq.(2) and text", text: "Rate modeled r_c proportional to (E-Eg)^m_c with Eg = 1.12 eV; data support m_c = 4.6 (Kamakura) rather than 3.5 (parabolic-band, Alig)."}
    - {tag: SOURCE_REPORTED, loc: "Eq.(4), Fig.4", text: "Log-linear form log10(g/(1-g)) ~ m_c log10(h-nu - 2Eg) - log10(A_c); Fig.4 log-log plot spans four orders of magnitude."}
    - {tag: SOURCE_REPORTED, loc: "Table I, Fig.2", text: "Laser reflectance: 325 nm rho = 0.03787 (u_rel 1.0%); 405 nm rho = 0.000545 (u_rel 2.2%)."}
    - {tag: SOURCE_REPORTED, loc: Methods, text: "Radiant power 2.8-4.5 uW, 1 V reverse bias; oxide model layers SiO2 220.9 nm, mixture 0.6 nm, roughness 0.3 nm (nominal)."}
    - {tag: SOURCE_REPORTED, loc: Discussion, text: "Delta-function closed form fails below ~350 nm (argument > 0.1); below 275 nm hole impact ionization must be included; structure at argument 0.25-0.35 attributed to non-constant electron-phonon scattering."}
  key_conditions: "Si induced-junction photodiodes, 220 nm SiO2 on high-resistance Si, 1 V reverse bias, 250-476 nm optical excitation; photodiode temperature and dimensions not stated in what was read (UNKNOWN)."
  why_fits: "Field-free, optical benchmark for the threshold power-law of impact ionization (m_c); the abstract itself ties the result to modelling of tunneling in MOS transistors. Gives an independent reference for the impact-ionization term used in GIDL/HCI/avalanche models."
  extrapolation_warnings:
    - "Photon-excited carriers in field-free induced-junction diodes, NOT a field-driven (HCI/avalanche) rate; do not insert m_c = 4.6 into a field-dependent HCI/GIDL lifetime model without a bridging argument (ENGINEERING_INFERENCE only)."
    - "No NAND device studied; relevance to cylindrical VNAND is indirect."
    - "Eq.(3) was garbled in extraction; do not reproduce it."
  overlap_check: "DOI not in ledger or any branch. No other impact-ionization measurement paper in prior reports."

