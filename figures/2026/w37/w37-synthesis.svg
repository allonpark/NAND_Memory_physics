</defs><rect width="1200" height="680" fill="#fff"/><text x="48" y="48" class="title">W37 synthesis - what the five papers jointly change in the reliability model</text><text x="48" y="78" class="sub">Cross-paper mechanism map: measured state variables, hidden state variables, and qualification consequences</text>
<rect x="55" y="120" width="1090" height="470" rx="18" class="gray"/>
<rect x="90" y="170" width="240" height="92" rx="12" class="blue"/><text x="110" y="200" class="h">Measured electrical state</text><text x="110" y="228" class="s">VTH · SS · gm · Igate</text><text x="110" y="250" class="s">retention · interference</text>
<rect x="470" y="150" width="275" height="132" rx="12" class="purple"/><text x="490" y="182" class="h">Hidden physical state</text><text x="490" y="212" class="s">Qtrap / Qfree / trap spectrum</text><text x="490" y="236" class="s">E_lat / band edge / residual stress</text><text x="490" y="260" class="s">history / material / geometry</text>
<rect x="865" y="170" width="240" height="92" rx="12" class="orange"/><text x="885" y="200" class="h">Failure / drift outcome</text><text x="885" y="228" class="s">lateral migration · DIBL</text><text x="885" y="250" class="s">retention · gate degradation</text>
<path d="M335 215 L458 215" stroke="#7c3aed" stroke-width="3" marker-end="url(#ab)"/><path d="M753 215 L853 215" stroke="#b45309" stroke-width="3" marker-end="url(#ao)"/>
<rect x="90" y="345" width="245" height="130" rx="12" class="green"/><text x="110" y="375" class="h">W37-1 / W37-3</text><text x="110" y="404" class="s">CTL transport / lateral field</text><text x="110" y="430" class="s">needs a transport map, not only</text><text x="110" y="454" class="s">long-time dVTH.</text>
<rect x="360" y="345" width="245" height="130" rx="12" class="green"/><text x="380" y="375" class="h">W37-2</text><text x="380" y="404" class="s">mechanical stress changes</text><text x="380" y="430" class="s">electronic barrier + channel</text><text x="380" y="454" class="s">performance simultaneously.</text>
<rect x="630" y="345" width="245" height="130" rx="12" class="green"/><text x="650" y="375" class="h">W37-4</text><text x="650" y="404" class="s">free and trapped charge must</text><text x="650" y="430" class="s">be separated in time before</text><text x="650" y="454" class="s">calling an observed shift “damage”.</text>
<rect x="900" y="345" width="205" height="130" rx="12" class="green"/><text x="920" y="375" class="h">W37-5</text><text x="920" y="404" class="s">single-Ea extrapolation</text><text x="920" y="430" class="s">fails across mechanism</text><text x="920" y="454" class="s">crossover.</text>
<rect x="55" y="610" width="1090" height="45" rx="10" class="red"/><text x="80" y="638" class="t">Updated state model: dD/dt = f(E(r,t), T, Qtrap, Qfree, stress, material, geometry, history) — not f(V,T,t) alone.</text></svg>