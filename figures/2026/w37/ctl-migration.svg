<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img">
<style>
  text{font-family:"Noto Sans CJK KR","DejaVu Sans",Arial,sans-serif; fill:#172033}
  .title{font-size:28px;font-weight:800}.sub{font-size:16px;fill:#667085}.h{font-size:18px;font-weight:750}.t{font-size:15px}.s{font-size:13px;fill:#667085}.xs{font-size:12px;fill:#7b8493}
  .box{fill:#fff;stroke:#9aa7b8;stroke-width:1.6}.blue{fill:#eaf2ff;stroke:#2563eb;stroke-width:2}.orange{fill:#fff4e8;stroke:#b45309;stroke-width:2}.green{fill:#eafaf5;stroke:#0f766e;stroke-width:2}.purple{fill:#f4efff;stroke:#7c3aed;stroke-width:2}.red{fill:#fff0f0;stroke:#c2410c;stroke-width:2}.gray{fill:#f5f7fa;stroke:#98a2b3;stroke-width:1.5}
  .thin{stroke:#667085;stroke-width:1.5;fill:none}.dash{stroke:#98a2b3;stroke-width:1.5;stroke-dasharray:7 6;fill:none}
  .arrB{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#ab)}.arrO{stroke:#b45309;stroke-width:3;fill:none;marker-end:url(#ao)}.arrG{stroke:#0f766e;stroke-width:3;fill:none;marker-end:url(#ag)}.arrR{stroke:#c2410c;stroke-width:3;fill:none;marker-end:url(#ar)}.arrP{stroke:#7c3aed;stroke-width:3;fill:none;marker-end:url(#ap)}
</style>
<defs>
  <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b45309"/></marker>
  <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
  <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/></marker>
  <marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
</defs><rect width="1200" height="680" fill="#ffffff"/>
<text x="48" y="48" class="title">W37-1 Evidence map - direct lateral-hole-migration measurement</text>
<text x="48" y="78" class="sub">Source-constrained redraw from Hwang et al., Applied Physics Reviews 13, 011424 (2026) - geometry simplified, bias/timing are source-reported</text>

<rect x="55" y="120" width="515" height="430" rx="16" class="gray"/>
<text x="80" y="154" class="h">A. Why the CP test vehicle matters</text>
<rect x="105" y="205" width="420" height="62" rx="10" class="orange"/><text x="315" y="241" text-anchor="middle" class="h">Si3N4 charge-trap layer</text>
<rect x="105" y="276" width="420" height="45" rx="8" class="green"/><text x="315" y="305" text-anchor="middle" class="t">tunnel oxide / Si channel</text>
<rect x="105" y="165" width="130" height="34" rx="7" class="blue"/><text x="170" y="187" text-anchor="middle" class="t">Gate region</text>
<rect x="395" y="165" width="130" height="34" rx="7" class="blue"/><text x="460" y="187" text-anchor="middle" class="t">Remote sense region</text>
<circle cx="195" cy="235" r="13" fill="#fff" stroke="#b45309" stroke-width="3"/><text x="195" y="241" text-anchor="middle" class="h" fill="#b45309">+</text>
<circle cx="225" cy="235" r="13" fill="#fff" stroke="#b45309" stroke-width="3"/><text x="225" y="241" text-anchor="middle" class="h" fill="#b45309">+</text>
<path d="M245 235 C315 198 360 198 415 232" class="arrO"/>
<text x="320" y="198" class="xs">remote transport path</text>
<text x="120" y="356" class="t">Design principle:</text>
<text x="120" y="382" class="t">separate the hole-injection path from the</text>
<text x="120" y="405" class="t">remote observation path so that migration is</text>
<text x="120" y="428" class="t">not inferred only from long-time retention.</text>
<text x="120" y="468" class="s">Source reports NP / FP / CP device variants; this panel</text>
<text x="120" y="488" class="s">shows only the source-supported CP measurement concept,</text>
<text x="120" y="508" class="s">not a literal reproduction of the copyrighted device drawing.</text>

<rect x="610" y="120" width="535" height="430" rx="16" class="box"/>
<text x="635" y="154" class="h">B. Erase-stress / read sequence used to isolate migration</text>
<line x1="675" y1="250" x2="1085" y2="250" class="thin"/>
<text x="660" y="255" text-anchor="end" class="s">Gate</text>
<polyline points="685,250 735,250 735,215 975,215 975,250 1045,250" fill="none" stroke="#2563eb" stroke-width="4"/>
<text x="850" y="203" text-anchor="middle" class="s">V_G = 0 V during erase pulse</text>
<line x1="675" y1="345" x2="1085" y2="345" class="thin"/>
<text x="660" y="350" text-anchor="end" class="s">S/D/Body</text>
<polyline points="685,345 735,345 735,295 975,295 975,345 1045,345" fill="none" stroke="#b45309" stroke-width="4"/>
<text x="850" y="285" text-anchor="middle" class="s">V_ERS = 6.0 V, pulse width = 100 μs</text>
<path d="M755 395 L1025 395" class="arrG"/><text x="890" y="383" text-anchor="middle" class="s">repeat N_ERS = 100 ... 100,000</text>
<rect x="690" y="438" width="170" height="62" rx="10" class="blue"/><text x="775" y="464" text-anchor="middle" class="t">charge pumping</text><text x="775" y="486" text-anchor="middle" class="s">local ΔVTH,CP</text>
<rect x="900" y="438" width="190" height="62" rx="10" class="green"/><text x="995" y="464" text-anchor="middle" class="t">transfer / GIDL read</text><text x="995" y="486" text-anchor="middle" class="s">ΔVTH, ΔVGIDL</text>
<path d="M862 469 L895 469" class="arrB"/>
<text x="635" y="528" class="xs">Source conditions are evidence anchors only; no numeric curve is reconstructed.</text>

<rect x="55" y="580" width="1090" height="64" rx="12" class="purple"/>
<text x="78" y="606" class="h">Interpretation gate</text><text x="250" y="606" class="s">Strong evidence requires correction of local FN-tunneling near the drain and separation from remote-hole transport.</text>
<text x="78" y="630" class="s">The report therefore presents measurement logic first, then translates the result into VNAND z-direction CTL transport.</text>
</svg>