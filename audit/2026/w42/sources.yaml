  title: "Model-Based Read-Reference-Voltage Compensation for Cross-Temperature Reliability in 3D TLC NAND Flash Memory"
  authors: [Cheng Luo, Qianqi Zhao, Minghui Dong, Yicheng Ke, Wangyong Chen, Ying Yang, Qi Wang, Zongliang Huo]
