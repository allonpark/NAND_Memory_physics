- id: W43-S1
  title: "Electron injection in tunneling-oxide-less charge-trap flash memories"
  authors: [Joonhyung Cho, Joon Hwang, Suyoung Park, Min-Kyu Park, Jong-Ho Lee]
  venue: "Applied Physics Letters 129(16), 163502"
  doi: 10.1063/5.0345638
  stable_url: https://pubs.aip.org/apl/article/129/16/163502/3406763/Electron-injection-in-tunneling-oxide-less-charge
  publication_date: 2026-10-19   # Crossref issued, published-print and published-online all 2026-10-19
  online_date: 2026-10-19
  discovery_date: 2026-10-21
  selection_class: new_this_week
  source_access: abstract_only   # publisher page: no access (paywall); not bypassed
  resolve_evidence: "doi.org -> HTTP 302 to pubs.aip.org/apl/article/129/16/163502/...; Crossref title/authors/dates match; AIP page returned abstract only"
  facts:
    - {tag: SOURCE_REPORTED, loc: abstract, text: "Physics-based TCAD framework for electron trapping in tunneling-oxide-less Al2O3/Si3N4 (AN) charge-trap devices, extended to Al2O3/Si3N4/SiO2 (ANO) stacks."}
    - {tag: SOURCE_REPORTED, loc: abstract, text: "In AN devices Si3N4 contacts the poly-Si channel directly, so a different injection model than for SiO2-tunnel-oxide ANO is needed."}
    - {tag: SOURCE_REPORTED, loc: abstract, text: "Model = Fowler-Nordheim tunneling through Si3N4 plus direct channel-to-nitride injection, represented by shallow and deep nitride trap levels."}
    - {tag: SOURCE_REPORTED, loc: abstract, text: "Et, Nt, tunneling effective mass m* and spatial distribution are calibrated to programming transients and ID-VG of fabricated AN devices."}
    - {tag: SOURCE_REPORTED, loc: abstract, text: "Calibrated model predicts delta-Vth and trapped-electron distributions versus program voltage and temperature."}
    - {tag: SOURCE_REPORTED, loc: abstract, text: "Same nitride parameters applied to ANO devices with different tunnel-oxide thickness; authors propose AN devices as platform to extract intrinsic nitride trap parameters."}
  key_conditions: "UNKNOWN (layer thicknesses, program voltages, temperatures, numeric Et/Nt/m* not readable: paywalled)"
  why_fits: "CTL / poly-Si channel trap physics; calibratable nitride trap parameters (Et, Nt, m*) relevant to PGM and retention modeling. Test-device geometry (planar vs cylindrical) is UNKNOWN; do not assume coaxial."
  extrapolation_warnings:
    - "Abstract-only: no numeric claims may be made."
    - "Parameters from a tunneling-oxide-less stack are not automatically transferable to cylindrical ONO VNAND cells."
  overlap_check: "DOI not in ledger, w37-w42, or weekly/2026-w40. W40 has a different 3D VNAND CTL TCAD paper (10.1088/2631-8695/aea754): different group and topic (injection model vs channel TCAD)."

