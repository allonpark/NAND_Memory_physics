<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430"><style>text{font-family:'Noto Sans CJK KR',sans-serif;fill:#172033}.s{font-size:20px}.sm{font-size:16px}.b{font-weight:700}</style><rect width="900" height="430" fill="white"/><text x="30" y="34" class="s b">Thin-SiN GaN MIS-HEMT gate TDDB: field + injected charge</text><rect x="170" y="105" width="560" height="50" fill="#ebe6ff" stroke="#6251a3"/><text x="385" y="137" class="s">metal gate</text><rect x="170" y="160" width="560" height="55" fill="#eef7ff" stroke="#3a6d92"/><text x="380" y="194" class="s">SiN: 10 / 3.5 / 1 nm</text><rect x="170" y="220" width="560" height="48" fill="#f5f0df" stroke="#9c7d2e"/><text x="365" y="250" class="s">AlGaN / GaN</text><line x1="450" y1="80" x2="450" y2="150" stroke="#d33" stroke-width="4"/><text x="465" y="105" class="sm">forward gate injection</text><circle cx="415" cy="188" r="7" fill="#d33"/><circle cx="455" cy="188" r="7" fill="#d33"/><circle cx="495" cy="188" r="7" fill="#d33"/><text x="260" y="308" class="sm">Same nominal E does not guarantee same TDDB: leakage mechanism controls Qinj.</text><text x="260" y="338" class="sm">Track dielectric degradation, not only a constant-current crossing.</text><text x="30" y="405" class="sm">Schematic / not to scale. Thickness values are source-reported.</text></svg>