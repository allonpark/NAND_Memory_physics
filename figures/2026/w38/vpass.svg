<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430"><style>text{font-family:'Noto Sans CJK KR',sans-serif;fill:#172033}.s{font-size:20px}.sm{font-size:16px}.b{font-weight:700}</style><rect width="900" height="430" fill="white"/><text x="30" y="34" class="s b">VPASS sets post-program charge confinement and retention field</text><rect x="120" y="80" width="150" height="240" fill="#dfe8f4" stroke="#53657c"/><rect x="375" y="80" width="150" height="240" fill="#dfe8f4" stroke="#53657c"/><rect x="630" y="80" width="150" height="240" fill="#dfe8f4" stroke="#53657c"/><text x="165" y="65" class="sm">Neighbor WL</text><text x="420" y="65" class="sm b">Selected WL</text><text x="675" y="65" class="sm">Neighbor WL</text><rect x="150" y="120" width="600" height="55" fill="#f8efd9" stroke="#9c7d2e"/><text x="345" y="153" class="sm">continuous SiN CTL</text><circle cx="435" cy="145" r="10" fill="#2463c5"/><circle cx="455" cy="145" r="10" fill="#2463c5"/><circle cx="475" cy="145" r="10" fill="#2463c5"/><text x="250" y="300" class="sm">program-time VPASS changes charge density / centroid</text><text x="250" y="330" class="sm">higher VPASS → lower retention-bake field → slower loss (reported trend)</text><text x="30" y="405" class="sm">Schematic / not to scale. Qualitative mechanism only.</text></svg>