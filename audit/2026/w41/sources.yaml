    online_date: "2026-10-08"
    selection_class: new_this_week
    source_access: full_text   # arXiv PDF, CC BY 4.0, pdftotext locally
    read_ranges: "pdftotext extraction (75,722 chars): chars 0-13,478 read in full (abstract, Intro, Methods, Sec 3.1 start); chars 13,478-~26,937 read with short lines (figure axis labels) filtered out, covering Sec 3.1-3.3, Conclusions, data availability, start of references; NOT read: chars ~26,937-75,722 (remaining references and Supplementary). Figures: not viewed."
    resolve_evidence:
      doi_org: "https://doi.org/10.48550/arXiv.2610.11643 -> HTTP 302 -> https://arxiv.org/abs/2610.11643"
      arxiv_api: "id_list=2610.11643 returned title/authors/published matching"
    facts:
      - {label: SOURCE_REPORTED, loc: "Abstract; Methods", text: "499 stoichiometric Si120N160 cells spanning 2.86-3.19 g/cm3 (415 from the companion study + 84 from an earlier one); 496 enter route analysis."}
      - {label: SOURCE_REPORTED, loc: "Sec 3.1; Fig 1b-c", text: "As density falls 3.15 -> 2.92 g/cm3, accessible void fraction rises 8.4 -> 12.6% and internal surface 997 -> 1225 angstrom^2 per cell; mean Si-N bond length changes by only 0.01 angstrom. Crystalline beta-Si3N4 gives 7.8% by the same measure."}
      - {label: SOURCE_REPORTED, loc: "Sec 3.1; Fig 2a", text: "Capture at pre-existing K centres rises 9% -> 29% with falling density; induced-K falls 45 -> 34%; polaron 46 -> 37%. Mean count of uncapped three-coordinate Si per cell rises 0.12 -> 0.45."}
      - {label: SOURCE_REPORTED, loc: "Sec 3.1; Fig 2c", text: "Crossover between polaronic and induced-K relaxation near neutral longest Si-N bond d4_0 = 1.90 angstrom."}
      - {label: SOURCE_REPORTED, loc: "Sec 3.2; Fig 3d", text: "Three-coordinate Si compensated by a bonded two-coordinate N hosts the detached gap state in only 5% of sites vs 67% for uncapped sites; well depth +1.1 -> -0.1 eV. Lowest-empty-state criterion gives K-centre capture in 98% of cells."}
      - {label: SOURCE_REPORTED, loc: "Sec 3.3; Fig 4b-c", text: "Corrected relaxation energy ~1.4 / 1.5 / 1.2 eV and trap depth ~3.25 / 3.34 / 2.87 eV below mobility edge for pre-existing K / induced K / polaron; polarons ~0.4 eV shallower; routes keep these scales across density."}
      - {label: SOURCE_REPORTED, loc: "Sec 3.3; Fig 4e", text: "Neutral-precursor multinomial model assigns 60% of held-out routes correctly (200 random splits) vs 41% from route fractions alone."}
      - {label: AUTHOR_INTERPRETATION, loc: "Sec 3.3/Conclusions", text: "Density acts through porosity and precursor supply, not through a change of the local capture criterion; density must be distinguished from composition when reading trap populations."}
    key_conditions: "DFT (CP2K, HSE06) on melt-quench cells, one added electron, fixed stoichiometry, void probe 0.8 angstrom, density percentiles 2.92 and 3.15 g/cm3 for stated trends."
    why_it_fits: "Links CTL film density/porosity (process knob) to the trap-route mixture and depth, relevant to retention and to why different SiN depositions behave differently."
    vnand_directness: "indirect-material (CTL SiN; no cell geometry or device measurement)."
    extrapolation_warnings:
      - "EXTRAPOLATION_ONLY for any statement about retention time, program/erase window, or process-specific VNAND CTL: all numbers are DFT trap energetics at fixed stoichiometry."
      - "Authors state fixed-composition Si3N4 only; real CTL composition and H content vary with process (their own caveat that density and composition must be separated)."
