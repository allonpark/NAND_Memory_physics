<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="white"/><text x="45" y="42" font-family="Arial" font-size="25" font-weight="700">Area-dependent TDDB: generation–annihilation competition</text><text x="45" y="70" font-family="Arial" font-size="15" fill="#667085">Physics redraw from Wu &amp; Ando (2026); schematic / not source numeric data</text><g font-family="Arial"><rect x="70" y="120" width="310" height="250" rx="16" fill="#f8fafc" stroke="#94a3b8"/><text x="225" y="150" text-anchor="middle" font-size="18" font-weight="700">Small stressed area</text><g fill="#ef4444"><circle cx="145" cy="210" r="9"/><circle cx="250" cy="260" r="9"/><circle cx="310" cy="195" r="9"/></g><g fill="none" stroke="#0f766e" stroke-width="4"><circle cx="145" cy="210" r="20"/><circle cx="310" cy="195" r="20"/></g><text x="225" y="330" text-anchor="middle" font-size="15">fewer competing near-BD paths</text><rect x="450" y="120" width="680" height="250" rx="16" fill="#fff7ed" stroke="#f59e0b"/><text x="790" y="150" text-anchor="middle" font-size="18" font-weight="700">Large stressed area</text><g fill="#ef4444"><circle cx="520" cy="210" r="9"/><circle cx="590" cy="280" r="9"/><circle cx="670" cy="195" r="9"/><circle cx="745" cy="245" r="9"/><circle cx="830" cy="300" r="9"/><circle cx="910" cy="190" r="9"/><circle cx="990" cy="260" r="9"/><circle cx="1060" cy="215" r="9"/></g><g fill="none" stroke="#0f766e" stroke-width="4"><circle cx="520" cy="210" r="20"/><circle cx="745" cy="245" r="20"/><circle cx="990" cy="260" r="20"/></g><text x="790" y="330" text-anchor="middle" font-size="15">generation ↑ with area, but annihilation opportunities also ↑</text><path d="M120 420 H1080" stroke="#334155" stroke-width="2"/><text x="600" y="452" text-anchor="middle" font-size="17">Classical inverse-area scaling is a limiting case; reverse/diminished scaling can emerge when defect annihilation is finite.</text><text x="600" y="485" text-anchor="middle" font-size="15" fill="#667085">Red dots: generated defects / green rings: annihilation centers. Do not interpret positions or counts quantitatively.</text></g></svg>