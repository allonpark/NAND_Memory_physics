    - id: F1
      label: SOURCE_REPORTED
      location: "Abstract; Introduction (PDF p.4-5)"
      text: "Authors state charge-trap 3D NAND is constrained by reliability degradation at device level, operating power at array level, and vertical-scaling saturation; reducing WL pitch has intensified dielectric breakdown in inter-layer space oxides and cell-to-cell interference. Data-availability statement: the Perspective contains NO new experimental data; all numbers are from cited literature."
    - id: F2
      label: SOURCE_REPORTED
      location: "Sec 'Scaling Limitations', Fig 2a-b (p.7-9)"
      text: "Combined WL + space-oxide height is stated to reach about 40 nm (ref 22); program voltage 'typically above 20 V' (refs 25, 39, 40); thinner inter-WL dielectric lowers its breakdown voltage and the PGM field accelerates space-oxide degradation. Fig 2b is a qualitative trade-off schematic, not data."
    - id: F3
      label: SOURCE_REPORTED
      location: "Sec 'Shaping the memory landscape', Fig 3a-d (p.11-15)"
      text: "Flat-band memory-window model for charge-trap flash: window increases with trapped charge Q_trap and decreases with charge-trap-layer and block-oxide capacitance; PGM/ERS use FN tunneling with magnitudes stated as exceeding about 20 V."
    - id: F4
      label: SOURCE_REPORTED
      location: "p.10, p.19-20, Fig 4 discussion"
      text: "Conventional charge-trap flash: ISPP slope stated to be limited to <=1 while ferroelectric NAND achieves >2; CTF endurance given as about 1e3-1e4 cycles with >20 V programming; gate-side-injection FeNAND endurance 1e3-1e4 cycles limited by gate-blocking-layer and interfacial-layer wear (p.27). All cited, none measured by these authors."
    - id: F5
      label: AUTHOR_INTERPRETATION
      location: "p.23 (architecture), Fig 5"
      text: "In a gate-all-around (cylindrical) geometry the gate-blocking layer sits on the outer surface and the interfacial layer inside, producing a field imbalance; authors propose a 'channel-all-around' arrangement to fix it. This is a proposal, labelled radical and not evaluated in the paper."
    - id: F6
      label: AUTHOR_INTERPRETATION
      location: "p.24-27"
      text: "Retention loss in gate-injection FeNAND is mainly in the ERS state through detrapping of gate-injected electrons; authors say the exact mechanism is not fully understood and suggest a self-reinforcing detrapping/depolarization loop. Short-term read-after-write delay is attributed to channel-injected interface charge that detraps over time."
    - id: F7
      label: SOURCE_REPORTED
      location: "p.29, p.31-33"
      text: "Erase-verify idea uses hole conduction via band-to-band tunneling between ground-select line and common source line (refs 100-102); oxide-semiconductor channels lack holes, which the authors say disables GIDL-assisted erase; poly-Si crystallization stated to need >950 C, incompatible with hafnia ferroelectrics; amorphous OS mobility quoted about 50 cm^2/Vs (comparison symbol lost in extraction)."
  key_conditions: "Review/perspective; numeric values are literature-cited and not tied to a single stack; no test temperature/time set."
  why_it_fits: "Maps the failure-mode landscape of charge-trap 3D NAND (inter-WL oxide breakdown, high-field FN stress, retention/detrapping, poly-Si channel limits, GIDL/BTBT erase) in one citable place; useful for T01, T05 and T02-type reasoning, with OS-channel vs poly-Si trade-offs."
  vnand_directness: "direct (charge-trap 3D NAND, GAA/cylindrical discussed qualitatively, poly-Si channel, GIDL-assisted erase)."
