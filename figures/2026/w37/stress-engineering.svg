<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-label="Residual stress engineering schematic for 3D NAND"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0e7490"/></marker></defs><rect width="1100" height="440" fill="#fff"/><text x="40" y="36" font-family="Arial" font-size="22" font-weight="700">Residual-stress engineering around a vertical NAND channel</text><text x="40" y="62" font-family="Arial" font-size="14" fill="#667085">Schematic / not to scale. SEL concept follows the open-access 2026 Nanoscale Advances study.</text><g transform="translate(305,235)"><circle r="150" fill="#eef2ff" stroke="#5367a2" stroke-width="2"/><circle r="120" fill="#fde68a" stroke="#b45309" stroke-width="2"/><circle r="92" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><circle r="65" fill="#d1fae5" stroke="#0f766e" stroke-width="2"/><circle r="44" fill="#e5e7eb" stroke="#64748b" stroke-width="2"/><text y="6" text-anchor="middle" font-family="Arial" font-size="15">SiO2 filler</text></g><text x="510" y="112" font-family="Arial" font-size="15">WL / outer stack</text><line x1="455" y1="125" x2="430" y2="150" stroke="#5367a2"/><text x="510" y="160" font-family="Arial" font-size="15">blocking oxide + CTN region</text><line x1="485" y1="170" x2="405" y2="190" stroke="#b45309"/><text x="510" y="208" font-family="Arial" font-size="15">poly-Si channel</text><line x1="455" y1="210" x2="375" y2="220" stroke="#0f766e"/><text x="510" y="256" font-family="Arial" font-size="15">high-CTE stress-engineering layer (SEL)</text><line x1="495" y1="260" x2="395" y2="252" stroke="#c2410c"/><path d="M235 104 L270 145" stroke="#0e7490" stroke-width="4" marker-end="url(#ar)"/><path d="M375 105 L344 147" stroke="#0e7490" stroke-width="4" marker-end="url(#ar)"/><path d="M202 235 L252 235" stroke="#0e7490" stroke-width="4" marker-end="url(#ar)"/><path d="M408 235 L360 235" stroke="#0e7490" stroke-width="4" marker-end="url(#ar)"/><text x="590" y="325" font-family="Arial" font-size="16" font-weight="700">Physical chain</text><text x="590" y="354" font-family="Arial" font-size="15">thermal mismatch -> higher CTN compressive stress</text><text x="590" y="380" font-family="Arial" font-size="15">-> band-edge modulation -> lower thermally assisted charge loss</text><text x="590" y="406" font-family="Arial" font-size="15">Trade-off: stronger stress can reduce on-current / shift initial Vth</text></svg>