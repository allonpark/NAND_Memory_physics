name: Build and deploy NAND Memory Physics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# PR runs must never cancel a main deployment.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests for the publication gate
        run: python3 -m unittest discover -s tests -v

      - name: Report gate (fail closed on placeholder / empty / non-bilingual reports)
        run: python3 scripts/publication_gate.py check

      - name: Install Korean fonts and PDF validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-core fonts-stix poppler-utils fontconfig
          fc-cache -f
          echo "Resolved Korean font:"
          fc-match "Noto Sans CJK KR"
          fc-match "Noto Sans CJK KR" | grep -qi "NotoSansCJK"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Build downloadable weekly PDFs (all non-draft weeks, auto-discovered)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publication_gate.py weeks | while read -r Y W; do
            mkdir -p "downloads/${Y}"
            PDF="$GITHUB_WORKSPACE/downloads/${Y}/VNAND_HV_Reliability_${Y}-W${W}.pdf"
            chrome --headless --no-sandbox --disable-gpu --allow-file-access-from-files \
              --run-all-compositor-stages-before-draw --virtual-time-budget=3000 \
              --no-pdf-header-footer --print-to-pdf="$PDF" \
              "file://$GITHUB_WORKSPACE/reports/${Y}/w${W}/index.html" < /dev/null
            test -s "$PDF"
          done

      - name: Validate PDF fonts and Korean text layer
        run: python3 scripts/publication_gate.py pdf-check

      - name: Stage site (draft weeks excluded)
        run: python3 scripts/publication_gate.py stage "$RUNNER_TEMP/site"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
