    - "Crossref: title and 8 authors match; issued 2026-09-25; created 2026-08-24"
    - "PDF cover: Received 2026-07-13, Accepted 2026-07-23, Publicized 2026-08-25"
    - "Discrepancy recorded: PDF running header says 'Vol.21, No.1' and copyright 2024 (template artifact) while Crossref/J-STAGE say vol 23 issue 18."
  facts:
    - id: F1
      label: SOURCE_REPORTED
      location: "Abstract, Sec 4.1 (Fig 5), Sec 5"
      text: "Worst-case RBER falls from 24.28% (baseline default read voltages) to 0.44% with the model-based compensation (relative 98.19%) in the most severe program/read temperature combination of Fig 5."
    - id: F2
      label: SOURCE_REPORTED
      location: "Sec 2, Algorithm 1"
      text: "Characterization: compensation circuit disabled; random data programmed at -40/0/40/80/120 C; baked 85 C for 10 h to suppress short-term retention loss; threshold-voltage distributions read at -40 to 120 C in 20 C steps. Platform named NplusT (Sec 4)."
    - id: F3
      label: SOURCE_REPORTED
      location: "Sec 2, Fig 2, Eq. (1)"
      text: "Mean Vth shift is approximately linear in read temperature for each program temperature (high R^2 reported) and so mainly follows the temperature difference between program and read, not absolute temperature; modelled as a temperature coefficient times delta-T."
    - id: F4
      label: SOURCE_REPORTED
      location: "Sec 2, Fig 3, Eq. (2)"
      text: "The temperature coefficient grows with P/E cycling, differs by program-state centre voltage, and varies with layer index (kept as a lookup table); modelled by piecewise-linear functions (engineering model, parameters must be re-extracted per device)."
    - id: F5
      label: AUTHOR_INTERPRETATION
      location: "Sec 2 paragraphs 1 and 4"
      text: "Authors attribute the temperature dependence to poly-Si channel grain boundaries/trap states acting on channel current (citing earlier work), and the P/E-cycle growth 'may be related to cycling-induced traps'; they defer the underlying physics to future device-level work. No test isolating these mechanisms is shown."
    - id: F6
      label: SOURCE_REPORTED
      location: "Table I, Sec 4.2"
      text: "SSDsim over 45 temperature pairs and ten workload traces: mean read response time 774.770 (baseline) vs 435.362 (model-based) vs 440.496 (lookup-table scheme) vs 435.008 (ideal read-retry), a 43.81% reduction; P90 1094.966 vs 436.020; std 323.055 vs 1.320. Time unit symbol was lost in extraction (UNKNOWN). These latencies are mapped from device-level RBER through a lookup table into a simulator, not measured on drives."
    - id: F7
      label: SOURCE_REPORTED
      location: "Sec 2 end"
      text: "A 128-layer 3D TLC device from another generation 'showed consistent cross-temperature trends' (data not shown); main-device layer count and chip count are not stated in the text read (UNKNOWN)."
  key_conditions: "3D TLC, poly-Si channel stated; short-term retention suppressed by an 85 C/10 h bake before temperature sweeps; compensation circuit off; verify voltages untouched."
  why_it_fits: "Chip-measured 3D NAND Vth-distribution temperature sensitivity with layer position, P/E cycling and program-state dependence; cross-temperature is a first-order read-margin/retention-interplay topic for VNAND reliability."
  vnand_directness: "direct (3D TLC NAND chips, layer-dependent behaviour)."
  extrapolation_warnings:
