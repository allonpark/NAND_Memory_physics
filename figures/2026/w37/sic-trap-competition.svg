</defs><rect width="1200" height="680" fill="#fff"/><text x="48" y="48" class="title">W37-5 Evidence map - four source-reported temperature trend classes under dynamic gate stress</text><text x="48" y="78" class="sub">Qualitative classes only: no source numeric y-values are reconstructed</text>
<rect x="55" y="120" width="1090" height="450" rx="16" class="gray"/><text x="80" y="154" class="h">Planar SiC MOSFETs stressed at 25 / 75 / 125 / 175°C</text>
