<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500"><rect width="1200" height="500" fill="white"/><text x="45" y="42" font-family="Arial" font-size="25" font-weight="700">Crystalline SiN / AlN sub-cap: strain → interface-state → VTH stability chain</text><text x="45" y="70" font-family="Arial" font-size="15" fill="#667085">Engineering redraw from Luo et al. (APL 2026); schematic / not to scale</text><g font-family="Arial"><text x="270" y="115" text-anchor="middle" font-size="18" font-weight="700">Without AlN sub-cap</text><rect x="80" y="135" width="380" height="55" fill="#fde68a" stroke="#b45309"/><text x="270" y="168" text-anchor="middle">crystalline SiN cap</text><rect x="80" y="190" width="380" height="70" fill="#dbeafe" stroke="#2563eb"/><text x="270" y="232" text-anchor="middle">AlGaN barrier</text><rect x="80" y="260" width="380" height="90" fill="#dcfce7" stroke="#0f766e"/><text x="270" y="312" text-anchor="middle">GaN / 2DEG</text><path d="M110 190 q30 -35 60 0 t60 0 t60 0 t60 0 t60 0" fill="none" stroke="#dc2626" stroke-width="5"/><text x="270" y="390" text-anchor="middle" font-size="15">local strain nonuniformity → interface states / mobility penalty</text><text x="890" y="115" text-anchor="middle" font-size="18" font-weight="700">With AlN sub-cap</text><rect x="700" y="135" width="380" height="55" fill="#fde68a" stroke="#b45309"/><text x="890" y="168" text-anchor="middle">crystalline SiN cap</text><rect x="700" y="190" width="380" height="30" fill="#f3e8ff" stroke="#7c3aed"/><text x="890" y="211" text-anchor="middle">AlN sub-cap</text><rect x="700" y="220" width="380" height="60" fill="#dbeafe" stroke="#2563eb"/><text x="890" y="256" text-anchor="middle">AlGaN barrier</text><rect x="700" y="280" width="380" height="70" fill="#dcfce7" stroke="#0f766e"/><text x="890" y="322" text-anchor="middle">GaN / 2DEG</text><path d="M730 190 H1050" stroke="#16a34a" stroke-width="5"/><text x="890" y="390" text-anchor="middle" font-size="15">more uniform strain → lower Dit → reported ΔVTH ≈ 0.02 V @ +2 V, 1000 s</text><text x="600" y="455" text-anchor="middle" font-size="15" fill="#667085">Do not generalize the reported stability to TDDB or high-drain OFF-state stress without separate validation.</text></g></svg>