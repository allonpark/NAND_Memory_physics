<g transform="translate(350,190)"><rect width="235" height="290" rx="12" class="box"/><text x="20" y="35" class="h">DUT-B</text><text x="20" y="62" class="s">positive T correlation</text><line x1="35" y1="235" x2="200" y2="235" class="thin"/><line x1="35" y1="235" x2="35" y2="105" class="thin"/><path d="M45 205 C90 190 140 155 190 120" stroke="#b45309" stroke-width="5" fill="none"/></g>
<g transform="translate(605,190)"><rect width="235" height="290" rx="12" class="box"/><text x="20" y="35" class="h">DUT-C</text><text x="20" y="62" class="s">negative → positive crossover</text><line x1="35" y1="235" x2="200" y2="235" class="thin"/><line x1="35" y1="235" x2="35" y2="105" class="thin"/><line x1="35" y1="175" x2="200" y2="175" class="dash"/><path d="M45 210 C90 205 115 195 130 175 C150 145 168 130 190 118" stroke="#7c3aed" stroke-width="5" fill="none"/></g>
<g transform="translate(860,190)"><rect width="235" height="290" rx="12" class="box"/><text x="20" y="35" class="h">DUT-D</text><text x="20" y="62" class="s">more negative with T</text><line x1="35" y1="235" x2="200" y2="235" class="thin"/><line x1="35" y1="235" x2="35" y2="105" class="thin"/><path d="M45 135 C95 155 140 190 190 215" stroke="#0f766e" stroke-width="5" fill="none"/></g>
<text x="80" y="525" class="s">Source characterization also considers VTH drift, subthreshold swing, subthreshold hysteresis and Ciss–VGS to resolve trap/interface differences.</text>
<rect x="55" y="590" width="1090" height="55" rx="10" class="purple"/><text x="80" y="622" class="t">Evidence meaning: a single universal activation energy cannot explain all four commercial/device trap landscapes.</text></svg>