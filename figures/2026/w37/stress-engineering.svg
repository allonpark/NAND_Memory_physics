</defs><rect width="1200" height="680" fill="#fff"/><text x="48" y="48" class="title">W37-2 Evidence map - source-reported 3D NAND stack and SEL placement</text><text x="48" y="78" class="sub">Redrawn from the open-access RSC paper (CC BY-NC 3.0); dimensions and operating anchors below are source-reported</text>
<rect x="55" y="112" width="650" height="500" rx="16" class="gray"/><text x="80" y="148" class="h">A. Radial cell-stack cross-section (not to scale)</text>
<text x="80" y="178" class="t">Outside → inside:</text>
<g transform="translate(380,365)">
<circle r="205" fill="#edf2f7" stroke="#64748b" stroke-width="2"/><circle r="176" fill="#dbeafe" stroke="#315da8" stroke-width="2"/><circle r="153" fill="#efe7ff" stroke="#7c3aed" stroke-width="2"/><circle r="132" fill="#f4f8ff" stroke="#2563eb" stroke-width="2"/><circle r="112" fill="#fff4e8" stroke="#b45309" stroke-width="2"/><circle r="88" fill="#eafaf5" stroke="#0f766e" stroke-width="2"/><circle r="65" fill="#ffe5d3" stroke="#c2410c" stroke-width="2"/><circle r="42" fill="#f5f7fa" stroke="#98a2b3" stroke-width="2"/>
<text y="6" text-anchor="middle" class="t">SiO2 filler</text></g>
<g class="s"><text x="80" y="215">1 W word line</text><text x="80" y="240">2 TiN metal barrier · 1 nm</text><text x="80" y="265">3 Al2O3 gate-side high-k · 2 nm</text><text x="80" y="290">4 SiO2 blocking oxide · 4 nm</text><text x="80" y="315">5 SiN CTN · 7 nm</text><text x="80" y="340">6 SiO2 tunnel oxide · 6 nm</text><text x="80" y="365">7 poly-Si channel</text><text x="80" y="390">8 SEL · 10 / 20 nm between channel and filler</text></g>
<text x="80" y="560" class="s">Source model: 10-layer 3D NAND; channel-hole radius ≈ 55 nm.</text><text x="80" y="584" class="s">This redraw preserves reported layer order / thickness, not geometric scale.</text>
<rect x="740" y="112" width="405" height="500" rx="16" class="box"/><text x="765" y="148" class="h">B. Source operating / retention anchors</text>
<rect x="775" y="185" width="335" height="82" rx="10" class="blue"/><text x="798" y="215" class="t">Program: ISPP 13–21 V</text><text x="798" y="242" class="s">1 ms pulse; unselected WL VPASS = 7 V</text>
<rect x="775" y="285" width="335" height="82" rx="10" class="orange"/><text x="798" y="315" class="t">Erase: 22 V to Si substrate</text><text x="798" y="342" class="s">10 ms pulse</text>
<rect x="775" y="385" width="335" height="82" rx="10" class="green"/><text x="798" y="415" class="t">Retention: terminals grounded, 85°C</text><text x="798" y="442" class="s">P7/P5/P2; simulation extends to 10^8 s</text>
<rect x="775" y="485" width="335" height="104" rx="10" class="purple"/><text x="798" y="515" class="t">Mechanical result</text><text x="798" y="540" class="s">baseline CTN vertical stress ≈ -0.2 GPa</text><text x="798" y="562" class="s">20 nm SEL: stronger retention + larger electrical penalty</text><text x="798" y="584" class="s">10 nm SEL: best balance among studied splits</text></svg>