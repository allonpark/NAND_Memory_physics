      crossref: "not applicable (arXiv DOIs are DataCite, not Crossref)"
    facts:
      - {label: SOURCE_REPORTED, loc: "Abstract; Sec 2.1; Methods 4.2", text: "Dataset = 415 pairs of relaxed neutral/negatively charged a-Si3N4 cells (455 deposited, 40 excluded for artefacts); 412 traps classified into 3 routes."}
      - {label: SOURCE_REPORTED, loc: "Sec 2.2", text: "Routes: polaron (Si4->Si4) n=165; induced K centre (Si4->Si3, Si-N bond breaks on capture) n=182; native K centre (Si3->Si3) n=65; 3 cells unassigned. Two readouts classify routes with 95.7% cross-validated accuracy."}
      - {label: SOURCE_REPORTED, loc: "Sec 2.4; Fig 5a", text: "Charge-induced Si-N bond breaking converts 182 of 347 four-coordinate Si precursors (52.4%) into three-coordinate trapped centres."}
      - {label: SOURCE_REPORTED, loc: "Sec 2.4; Fig 5c", text: "Induced-K centres = 30 of 42 traps (71.4%) in upper corrected-stabilisation decile vs 44.2% of all classified traps; polarons only 3 of 42 (7.1%). Same route = 29 of 42 deepest (69.0%) by spectral trap depth."}
      - {label: SOURCE_REPORTED, loc: "Sec 2.3", text: "Corrected stabilisation spans 0.9-2.1 eV (5th-95th percentile); localisation spans 4-33 effective atoms; local RMS ionic displacement 0.12-0.30 angstrom."}
      - {label: SOURCE_REPORTED, loc: "Methods 4.1", text: "CP2K v2023.1, HSE06 hybrid functional, Gamma point, spin-polarised; melt-quench cells (MG2 potential, 1 K/ps cooling) then hybrid-DFT relaxed; force threshold 0.005 eV/angstrom."}
      - {label: SOURCE_REPORTED, loc: "Methods 4.3", text: "Dielectric constants used for image-charge correction: electronic eps=4.2, static eps_s=7.8. Neutral mobility edge uses participation criterion N_eff <= 56 (one fifth of cell)."}
      - {label: SOURCE_REPORTED, loc: "Sec 2.3", text: "Held-out R^2 of single-descriptor calibrations is modest (0.26 for relaxation vs 0.24 route-mean baseline; 0.59-0.60 for stabilisation); Spearman rho 0.636-0.765 for the main correlations."}
    key_conditions: "Zero-temperature DFT on small periodic amorphous cells, single added electron, Gamma point, no hydrogen, no applied field, no cell geometry of a memory stack. Spectral/energetic numbers carry the finite-size correction scheme chosen by the authors."
    why_it_fits: "Directly addresses the charge-trap layer (CTL) material physics behind retention/threshold stability: which atomic sites trap electrons and how deep. Supplies a mechanism taxonomy (polaron / native K / induced K) for TRAP-ENERGY discussion."
    vnand_directness: "indirect-material (CTL SiN material; no cylindrical cell, no device data). The paper itself says nitride trapping underlies non-volatile memory but does not model a VNAND cell."
    extrapolation_warnings:
      - "EXTRAPOLATION_ONLY if used for retention lifetime, Vt shift, or detrapping rate: no kinetics, temperature, field, or hydrogen content are modelled."
      - "Deposited VNAND SiN is typically non-stoichiometric/hydrogenated; this study is stoichiometric a-Si3N4 without H (ENGINEERING_INFERENCE about mismatch; hydrogen role is the authors' earlier work, not re-checked here)."
