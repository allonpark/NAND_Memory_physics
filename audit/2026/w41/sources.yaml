  - id: W41-S2
    title: "The role of density in shaping electron trapping in amorphous silicon nitride"
    authors: ["Jonathon Cottom", "Emilia Olsson"]
    affiliations: "Univ. of Amsterdam and ARCNL, Amsterdam"
    venue: "arXiv preprint cond-mat.mtrl-sci, arXiv:2610.11643v1 (not peer reviewed)"
    doi_or_url: "10.48550/arXiv.2610.11643 ; https://arxiv.org/abs/2610.11643"
