<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="white"/><text x="45" y="42" font-family="Arial" font-size="25" font-weight="700">40-nm-class IGZO vertical charge-trap memory: gate-stack engineering</text><text x="45" y="70" font-family="Arial" font-size="15" fill="#667085">Structure-level interpretation from Jung et al. (ACS AMI 2026); schematic / not to scale</text><g font-family="Arial"><rect x="120" y="120" width="180" height="300" rx="20" fill="#e2e8f0" stroke="#64748b"/><text x="210" y="275" text-anchor="middle" font-size="18">vertical</text><text x="210" y="300" text-anchor="middle" font-size="18">a-IGZO channel</text><rect x="300" y="145" width="80" height="250" fill="#dcfce7" stroke="#0f766e"/><text x="340" y="285" transform="rotate(-90 340 285)" text-anchor="middle" font-size="16">tunnel dielectric</text><rect x="380" y="145" width="100" height="250" fill="#fde68a" stroke="#b45309"/><text x="430" y="285" transform="rotate(-90 430 285)" text-anchor="middle" font-size="16">nanocrystalline ZnO CTL</text><rect x="480" y="145" width="90" height="250" fill="#dbeafe" stroke="#2563eb"/><text x="525" y="285" transform="rotate(-90 525 285)" text-anchor="middle" font-size="16">blocking / gate dielectric</text><rect x="570" y="145" width="180" height="250" fill="#cbd5e1" stroke="#475569"/><text x="660" y="275" text-anchor="middle" font-size="18">gate</text><path d="M270 220 C340 180 400 185 445 220" fill="none" stroke="#dc2626" stroke-width="5"/><text x="360" y="170" text-anchor="middle" font-size="15" fill="#b91c1c">program / charge capture</text><path d="M445 330 C385 365 330 360 270 330" fill="none" stroke="#7c3aed" stroke-width="5"/><text x="360" y="395" text-anchor="middle" font-size="15" fill="#6d28d9">erase remains the scaling bottleneck</text><rect x="820" y="135" width="300" height="245" rx="16" fill="#f8fafc" stroke="#94a3b8"/><text x="970" y="175" text-anchor="middle" font-size="18" font-weight="700">Domain-boundary warning</text><text x="850" y="215" font-size="15">• IGZO channel ≠ poly-Si channel</text><text x="850" y="250" font-size="15">• ZnO CTL ≠ SiN CTL</text><text x="850" y="285" font-size="15">• erase transport differs</text><text x="850" y="320" font-size="15">• use as Z-scaling evidence,</text><text x="870" y="345" font-size="15">not direct VNAND lifetime model</text><text x="600" y="475" text-anchor="middle" font-size="15" fill="#667085">Source reports an ultra-scaled V-CTM TFT and validates gate-stack engineering in the 40 nm scaling regime.</text></g></svg>